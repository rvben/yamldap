[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # RUSTSEC-2026-0441: pin-utils is unmaintained and has no patched release.
    # It is a transitive dependency of futures-util 0.3.31, the newest release,
    # so only an upstream futures release can remove it. Mirrors the entry in
    # .cargo/audit.toml.
    # Review by 2027-02-24: drop this entry once futures-util stops using it.
    { id = "RUSTSEC-2026-0441", reason = "unmaintained transitive dependency of futures-util with no patched release" },
]

[licenses]
version = 2
confidence-threshold = 0.8
# Some allowed licenses are platform-specific and may not appear on every host.
unused-allowed-license = "allow"
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "NCSA",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
exceptions = []

[bans]
# Transitive ecosystems such as notify and Windows support intentionally span
# compatible major versions; security and source policy remain strict below.
multiple-versions = "allow"
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
