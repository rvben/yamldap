name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: 1.87.0

jobs:
  validate:
    name: Validate release metadata
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - name: Validate tag, package, lockfile, and changelog
        id: metadata
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            TAG_NAME=$GITHUB_REF_NAME
          else
            VERSION=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
            TAG_NAME=v$VERSION
          fi

          VERSION=$(python3 .github/scripts/validate_release.py "$TAG_NAME")
          cargo metadata --locked --no-deps --format-version 1 >/dev/null

          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            test "$(git rev-parse "$TAG_NAME^{commit}")" = "$GITHUB_SHA"
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  verify:
    name: Mandatory verification
    uses: ./.github/workflows/verify.yml

  build:
    name: Build ${{ matrix.target }}
    needs:
      - validate
      - verify
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: yamldap
            asset_name: yamldap-linux-amd64
          - os: [self-hosted, Linux, ARM64]
            target: aarch64-unknown-linux-gnu
            artifact_name: yamldap
            asset_name: yamldap-linux-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: yamldap.exe
            asset_name: yamldap-windows-amd64.exe
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: yamldap
            asset_name: yamldap-macos-amd64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: yamldap
            asset_name: yamldap-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: ${{ env.RUST_VERSION }}
          target: ${{ matrix.target }}
      - name: Build locked release binary
        run: make build-target TARGET=${{ matrix.target }}
      - name: Smoke test binary
        shell: bash
        run: target/${{ matrix.target }}/release/${{ matrix.artifact_name }} --version
      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.asset_name }}
          path: target/${{ matrix.target }}/release/${{ matrix.artifact_name }}
          if-no-files-found: error
          retention-days: 7

  checksums:
    name: Assemble verified release assets
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download release binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: yamldap-*
          path: artifacts
      - name: Name assets and generate checksums
        shell: bash
        run: |
          mkdir release-assets
          for directory in artifacts/*
          do
            asset_name=$(basename "$directory")
            binary=$(find "$directory" -maxdepth 1 -type f -print -quit)
            test -n "$binary"
            cp "$binary" "release-assets/$asset_name"
          done
          chmod +x release-assets/yamldap-*
          (cd release-assets && sha256sum yamldap-* > SHA256SUMS)
      - name: Upload release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  test-container:
    name: Functional container smoke test
    needs:
      - validate
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download Linux binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: yamldap-linux-*
          path: artifacts
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build test image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.release
          platforms: linux/amd64
          load: true
          tags: yamldap:release-smoke-test
          build-args: |
            VERSION=${{ needs.validate.outputs.version }}
            REVISION=${{ github.sha }}
      - name: Require non-root image metadata
        run: test "$(docker image inspect --format '{{.Config.User}}' yamldap:release-smoke-test)" = "65532:65532"
      - name: Run read-only container
        shell: bash
        run: |
          docker run --detach --name yamldap-release-smoke \
            --read-only --cap-drop ALL --security-opt no-new-privileges \
            --publish 127.0.0.1:1389:1389 \
            --volume "$PWD/examples/sample_directory.yaml:/data/directory.yaml:ro" \
            yamldap:release-smoke-test \
            -f /data/directory.yaml \
            --bind-address 0.0.0.0 \
            --port 1389 \
            --allow-insecure-non-loopback
      - name: Bind and query RootDSE
        shell: bash
        run: |
          python3 - <<'PY'
          import socket
          import time

          def length(value: int) -> bytes:
              if value < 128:
                  return bytes([value])
              encoded = value.to_bytes((value.bit_length() + 7) // 8, "big")
              return bytes([0x80 | len(encoded)]) + encoded

          def tlv(tag: int, value: bytes) -> bytes:
              return bytes([tag]) + length(len(value)) + value

          def read_exact(size: int) -> bytes:
              chunks = []
              remaining = size
              while remaining:
                  chunk = connection.recv(remaining)
                  if not chunk:
                      raise AssertionError("connection closed before complete LDAP message")
                  chunks.append(chunk)
                  remaining -= len(chunk)
              return b"".join(chunks)

          def read_length_from_socket() -> int:
              first = read_exact(1)[0]
              if first < 128:
                  return first
              width = first & 0x7f
              assert 0 < width <= 4, f"invalid BER length width: {width}"
              return int.from_bytes(read_exact(width), "big")

          def read_message() -> bytes:
              tag = read_exact(1)[0]
              assert tag == 0x30, f"expected LDAPMessage sequence, got 0x{tag:02x}"
              return read_exact(read_length_from_socket())

          def parse_tlv(data: bytes, offset: int = 0) -> tuple[int, bytes, int]:
              assert offset < len(data), "missing BER tag"
              tag = data[offset]
              offset += 1
              assert offset < len(data), "missing BER length"
              first = data[offset]
              offset += 1
              if first < 128:
                  value_length = first
              else:
                  width = first & 0x7f
                  assert 0 < width <= 4, f"invalid BER length width: {width}"
                  end = offset + width
                  assert end <= len(data), "truncated BER length"
                  value_length = int.from_bytes(data[offset:end], "big")
                  offset = end
              end = offset + value_length
              assert end <= len(data), "truncated BER value"
              return tag, data[offset:end], end

          def protocol_operation(message: bytes) -> tuple[int, bytes]:
              message_id_tag, _, offset = parse_tlv(message)
              assert message_id_tag == 0x02, "LDAP message is missing its message ID"
              operation_tag, operation, end = parse_tlv(message, offset)
              assert end == len(message), "unexpected trailing LDAP message fields"
              return operation_tag, operation

          def assert_success(operation: bytes) -> None:
              result_tag, result, _ = parse_tlv(operation)
              assert result_tag == 0x0a, "LDAP result is missing its result code"
              assert int.from_bytes(result, "big") == 0, operation.hex()

          deadline = time.monotonic() + 20
          while True:
              try:
                  connection = socket.create_connection(("127.0.0.1", 1389), timeout=1)
                  break
              except OSError:
                  if time.monotonic() >= deadline:
                      raise
                  time.sleep(0.1)

          bind_dn = b"uid=jdoe,ou=users,dc=example,dc=com"
          bind = tlv(0x60, b"\x02\x01\x03" + tlv(0x04, bind_dn) + tlv(0x80, b"password123"))
          connection.sendall(tlv(0x30, b"\x02\x01\x01" + bind))
          operation_tag, operation = protocol_operation(read_message())
          assert operation_tag == 0x61, f"expected BindResponse, got 0x{operation_tag:02x}"
          assert_success(operation)

          search = tlv(
              0x63,
              tlv(0x04, b"")
              + b"\x0a\x01\x00"
              + b"\x0a\x01\x00"
              + b"\x02\x01\x01"
              + b"\x02\x01\x05"
              + b"\x01\x01\x00"
              + tlv(0x87, b"objectClass")
              + tlv(0x30, b""),
          )
          connection.sendall(tlv(0x30, b"\x02\x01\x02" + search))
          entries = 0
          while True:
              operation_tag, operation = protocol_operation(read_message())
              if operation_tag == 0x65:
                  assert_success(operation)
                  break
              assert operation_tag == 0x64, f"unexpected search response: 0x{operation_tag:02x}"
              entries += 1
          assert entries == 1, f"expected one RootDSE entry, got {entries}"
          connection.close()
          PY
      - name: Show container logs on failure
        if: ${{ failure() }}
        run: docker logs yamldap-release-smoke
      - name: Remove smoke-test container
        if: ${{ always() }}
        run: docker rm --force yamldap-release-smoke

  publication-gate:
    name: Pre-publication gate
    if: ${{ always() }}
    needs:
      - validate
      - verify
      - build
      - checksums
      - test-container
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all pre-publication jobs
        env:
          VALIDATE_RESULT: ${{ needs.validate.result }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          CHECKSUM_RESULT: ${{ needs.checksums.result }}
          CONTAINER_RESULT: ${{ needs.test-container.result }}
        run: |
          for result in \
            "$VALIDATE_RESULT" \
            "$VERIFY_RESULT" \
            "$BUILD_RESULT" \
            "$CHECKSUM_RESULT" \
            "$CONTAINER_RESULT"
          do
            test "$result" = success
          done

  dry-run:
    name: Dry-run summary
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs:
      - validate
      - publication-gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "Release ${{ needs.validate.outputs.version }} passed every pre-publication gate; nothing was published."

  publish-crate:
    name: Publish to crates.io
    if: ${{ github.event_name == 'push' }}
    needs:
      - validate
      - publication-gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - name: Authenticate with crates.io
        id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish locked crate
        run: make publish-crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}

  publish-docker-hub:
    name: Publish Docker Hub image
    if: ${{ github.event_name == 'push' }}
    needs:
      - validate
      - publication-gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download Linux binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: yamldap-linux-*
          path: artifacts
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push immutable version tag
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: docker.io/rvben/yamldap:${{ needs.validate.outputs.version }}
          build-args: |
            VERSION=${{ needs.validate.outputs.version }}
            REVISION=${{ github.sha }}
          provenance: mode=max
          sbom: true

  publish-ghcr:
    name: Publish GHCR image
    if: ${{ github.event_name == 'push' }}
    needs:
      - validate
      - publication-gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download Linux binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: yamldap-linux-*
          path: artifacts
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push immutable version tag
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/rvben/yamldap:${{ needs.validate.outputs.version }}
          build-args: |
            VERSION=${{ needs.validate.outputs.version }}
            REVISION=${{ github.sha }}
          provenance: mode=max
          sbom: true

  update-container-latest:
    name: Update container latest tags
    if: ${{ github.event_name == 'push' }}
    needs:
      - validate
      - publish-docker-hub
      - publish-ghcr
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Update latest from immutable manifests
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          docker buildx imagetools create \
            --tag docker.io/rvben/yamldap:latest \
            docker.io/rvben/yamldap:"$VERSION"
          docker buildx imagetools create \
            --tag ghcr.io/rvben/yamldap:latest \
            ghcr.io/rvben/yamldap:"$VERSION"

  release:
    name: Create GitHub Release
    if: ${{ github.event_name == 'push' }}
    needs:
      - validate
      - checksums
      - publish-crate
      - publish-docker-hub
      - publish-ghcr
      - update-container-latest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: release-assets
      - name: Extract release notes
        run: |
          ./scripts/extract-changelog.sh "${{ needs.validate.outputs.version }}" > release-notes.md
          test -s release-notes.md
      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          body_path: release-notes.md
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  summary:
    name: Release summary
    if: ${{ always() }}
    needs:
      - validate
      - publication-gate
      - dry-run
      - publish-crate
      - publish-docker-hub
      - publish-ghcr
      - update-container-latest
      - release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report outcome
        env:
          EVENT_NAME: ${{ github.event_name }}
          GATE_RESULT: ${{ needs.publication-gate.result }}
          DRY_RUN_RESULT: ${{ needs.dry-run.result }}
          CRATE_RESULT: ${{ needs.publish-crate.result }}
          DOCKER_HUB_RESULT: ${{ needs.publish-docker-hub.result }}
          GHCR_RESULT: ${{ needs.publish-ghcr.result }}
          LATEST_RESULT: ${{ needs.update-container-latest.result }}
          RELEASE_RESULT: ${{ needs.release.result }}
        run: |
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            test "$GATE_RESULT" = success
            test "$DRY_RUN_RESULT" = success
            echo "Dry run completed without publishing."
          else
            test "$GATE_RESULT" = success
            test "$CRATE_RESULT" = success
            test "$DOCKER_HUB_RESULT" = success
            test "$GHCR_RESULT" = success
            test "$LATEST_RESULT" = success
            test "$RELEASE_RESULT" = success
            echo "Release published successfully."
          fi
