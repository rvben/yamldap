name: Release

on:
  push:
    tags:
      - 'v*'
  # Manual trigger for testing
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run mode (skip actual publishing)'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: yamldap
            asset_name: yamldap-linux-amd64
          - os: [self-hosted, Linux, ARM64]
            target: aarch64-unknown-linux-gnu
            artifact_name: yamldap
            asset_name: yamldap-linux-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: yamldap.exe
            asset_name: yamldap-windows-amd64.exe
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: yamldap
            asset_name: yamldap-macos-amd64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: yamldap
            asset_name: yamldap-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}

      - name: Build
        run: make build-target TARGET=${{ matrix.target }}

      - name: Smoke test binary
        shell: bash
        run: target/${{ matrix.target }}/release/${{ matrix.artifact_name }} --version

      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.asset_name }}
          path: target/${{ matrix.target }}/release/${{ matrix.artifact_name }}

  release:
    name: Create Release
    needs: [build, publish-crate, publish-docker-hub, publish-ghcr]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download release binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: yamldap-*
          path: artifacts

      - name: Extract release notes
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          VERSION=${TAG_NAME#v}
          if [ -f scripts/extract-changelog.sh ] && [ -f CHANGELOG.md ]; then
            chmod +x scripts/extract-changelog.sh
            ./scripts/extract-changelog.sh "$VERSION" > release-notes.md || echo "No changelog entry found for $VERSION" > release-notes.md
          else
            echo "No changelog found" > release-notes.md
          fi

      - name: Prepare release assets
        run: |
          mkdir release-assets
          for dir in artifacts/*/; do
            if [ -d "$dir" ]; then
              asset_name=$(basename "$dir")
              cp "$dir"* "release-assets/$asset_name"
              chmod +x "release-assets/$asset_name"
            fi
          done

      - name: Create GitHub Release
        if: ${{ inputs.dry_run != true }}
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          body_path: release-notes.md
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Test Release Creation (dry run)
        if: ${{ inputs.dry_run == true }}
        run: |
          echo "DRY RUN: Would create release with:"
          echo "- Release notes from: release-notes.md"
          echo "- Release notes content:"
          cat release-notes.md
          echo ""
          echo "- Artifacts:"
          ls -la release-assets/

  publish-crate:
    name: Publish to crates.io
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: stable

      - name: Authenticate with crates.io
        if: ${{ inputs.dry_run != true }}
        id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish to crates.io
        if: ${{ inputs.dry_run != true }}
        run: make publish-crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}

      - name: Test crates.io publish (dry run)
        if: ${{ inputs.dry_run == true }}
        run: |
          echo "DRY RUN: Would publish to crates.io"
          make publish-crate-dry

  test-container:
    name: Smoke test release container
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download Linux binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: yamldap-linux-*
          path: artifacts

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build test image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.release
          platforms: linux/amd64
          load: true
          tags: yamldap:release-smoke-test
          build-args: |
            VERSION=smoke-test
            REVISION=${{ github.sha }}

      - name: Run test image
        run: docker run --rm yamldap:release-smoke-test --version

  publish-docker-hub:
    name: Publish Docker Hub image
    needs: [build, test-container]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download Linux binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: yamldap-linux-*
          path: artifacts

      - name: Extract version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION=latest
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to Docker Hub
        if: ${{ inputs.dry_run != true }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679fd # v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker Hub image
        if: ${{ inputs.dry_run != true }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            docker.io/rvben/yamldap:${{ steps.version.outputs.version }}
            docker.io/rvben/yamldap:latest
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            REVISION=${{ github.sha }}
          provenance: mode=max
          sbom: true

      - name: Test Docker Hub image (dry run)
        if: ${{ inputs.dry_run == true }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.release
          platforms: linux/amd64,linux/arm64
          outputs: type=oci,dest=${{ runner.temp }}/yamldap-docker-hub.tar
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            REVISION=${{ github.sha }}

  publish-ghcr:
    name: Publish GHCR image
    needs: [build, test-container]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download Linux binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: yamldap-linux-*
          path: artifacts

      - name: Extract version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION=latest
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GitHub Container Registry
        if: ${{ inputs.dry_run != true }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679fd # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push GHCR image
        if: ${{ inputs.dry_run != true }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/rvben/yamldap:${{ steps.version.outputs.version }}
            ghcr.io/rvben/yamldap:latest
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            REVISION=${{ github.sha }}
          provenance: mode=max
          sbom: true

      - name: Test GHCR image (dry run)
        if: ${{ inputs.dry_run == true }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.release
          platforms: linux/amd64,linux/arm64
          outputs: type=oci,dest=${{ runner.temp }}/yamldap-ghcr.tar
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            REVISION=${{ github.sha }}

  summary:
    name: Release Summary
    needs: [release, publish-crate, test-container, publish-docker-hub, publish-ghcr]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    steps:
      - name: Summary
        run: |
          if [[ "${{ inputs.dry_run }}" == "true" ]]; then
            echo "## 🧪 Dry Run Complete!"
            echo ""
            echo "The release pipeline executed successfully in dry-run mode."
            echo "All artifacts were built but nothing was published."
            echo ""
            echo "To do an actual release:"
            echo "1. Run vership preflight"
            echo "2. Run vership bump patch (or minor/major)"
            echo "3. Run vership verify after this workflow completes"
          elif [[ "${{ needs.release.result }}" == "success" && \
                  "${{ needs.publish-crate.result }}" == "success" && \
                  "${{ needs.test-container.result }}" == "success" && \
                  "${{ needs.publish-docker-hub.result }}" == "success" && \
                  "${{ needs.publish-ghcr.result }}" == "success" ]]; then
            echo "## 🎉 Release Complete!"
            echo ""
            echo "The release has been published successfully:"
            echo "- ✅ Binaries uploaded to GitHub Release"
            echo "- ✅ Package published to crates.io"
            echo "- ✅ Docker images pushed to Docker Hub and GHCR"
          else
            echo "## ❌ Release Incomplete"
            echo ""
            echo "- GitHub Release: ${{ needs.release.result }}"
            echo "- crates.io: ${{ needs.publish-crate.result }}"
            echo "- Container smoke test: ${{ needs.test-container.result }}"
            echo "- Docker Hub: ${{ needs.publish-docker-hub.result }}"
            echo "- GHCR: ${{ needs.publish-ghcr.result }}"
            exit 1
          fi
