name: Dependency security remediation

on:
  schedule:
    - cron: "29 7 * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  id-token: write

jobs:
  remediate:
    name: Propose vulnerability fixes
    uses: rvben/upd/.github/workflows/dependency-remediation.yml@ac374e74eb4f6b5cbd39965c65292ae5e2b51411 # v0.9.2
    with:
      publish: true
      langs: rust
      allowed-paths: Cargo.toml Cargo.lock fuzz/Cargo.toml fuzz/Cargo.lock
      prepare-command: rustup toolchain install 1.87.0 --profile minimal --component clippy,rustfmt && rustup default 1.87.0
      validation-command: make fmt-check check lint test docs-check
      branch: security/upd-dependencies
      commit-message: "fix(deps): remediate vulnerable dependencies with upd"
      auto-merge: false
