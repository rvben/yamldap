name: Dependency maintenance

on:
  schedule:
    - cron: "17 6 * * 2"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pull-requests: read

jobs:
  update:
    name: Propose policy-approved updates
    uses: rvben/upd/.github/workflows/dependency-health.yml@1d9075c8c5c2b15242cecc85367edbdebc7d7178
    with:
      langs: rust,actions
      lock: true
      min-age: 7d
      max-bump: minor
      update-action-shas: true
      prepare-command: rustup toolchain install 1.87.0 --profile minimal --component clippy,rustfmt && rustup default 1.87.0
      validation-command: make fmt-check check lint test docs-check
      fail-on-blocked: true
      branch: automation/upd-dependencies
      commit-message: "chore(deps): update dependencies with upd"
      auto-merge: false
