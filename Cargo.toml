[package]
name = "yamldap"
version = "0.2.0"
edition = "2021"
rust-version = "1.87"
authors = ["Ruben J. Jongejan <ruben.jongejan@gmail.com>"]
description = "A lightweight LDAP server that serves directory data from YAML files"
license = "MIT OR Apache-2.0"
repository = "https://github.com/rvben/yamldap"
readme = "README.md"
homepage = "https://github.com/rvben/yamldap"
documentation = "https://docs.rs/yamldap"
keywords = ["ldap", "yaml", "directory", "authentication", "testing"]
categories = ["authentication", "development-tools::testing", "network-programming"]
exclude = [
    "/.github",
    "/assets/*.png",
    "/assets/fonts",
    "/assets/logo-concepts",
    "/docs/logo-report.html",
    "*.sh",
    "*.py",
    "/coverage",
]

[features]
default = []
unstable-internals = []

[dependencies]
# Async runtime and networking
tokio = { version = "1.40", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
bytes = "1.11.1"
futures = "0.3"

# YAML and data processing
serde = { version = "1.0", features = ["derive"] }
serde_yaml_ng = "0.10"

# CLI and configuration
clap = { version = "4.5", features = ["derive"] }

# Cryptography and password handling
bcrypt = "0.15"
sha1 = "0.10"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"

# Error handling and logging
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }

# File watching and utilities
notify = "6.1"
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
criterion = "0.5"
tempfile = "3.10"
ldap3 = "0.11"

[[bin]]
name = "yamldap"
path = "src/main.rs"

[[bench]]
name = "ldap_performance"
harness = false
required-features = ["unstable-internals"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
